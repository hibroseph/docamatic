  <p style="margin:0">Spaced repetition is a learning technique in which material is reviewed at <mark class="dm-hl">increasing intervals</mark>. Research on the forgetting curve suggests that <mark class="dm-hl dm-hl--green dm-hl--noted">each review strengthens the memory</mark> and slows how fast it fades. The <mark class="dm-hl dm-hl--pink">testing effect</mark> shows that recalling beats re-reading.</p>
