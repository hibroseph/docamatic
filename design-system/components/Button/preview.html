<!-- @dsCard group="Actions" height=96 subtitle="Primary, secondary, ghost, danger, icon" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; }
  body { background: var(--paper); color: var(--ink); font-family: var(--font-body); }
  .stage { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-4); padding: var(--space-4); }
  
</style>
</head>
<body class="dm-root">
<div class="stage">
  <button class="dm-btn dm-btn--primary" type="button"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M8 3v10M3 8h10"/></svg>New note</button>
  <button class="dm-btn" type="button">Open side panel</button>
  <button class="dm-btn dm-btn--ghost" type="button">Cancel</button>
  <button class="dm-btn dm-btn--danger" type="button"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 4.5h10M6.5 4.5V3h3v1.5M4.5 4.5l.6 8.5h5.8l.6-8.5"/></svg>Delete all notes</button>
  <button class="dm-btn dm-btn--icon" type="button" aria-label="Favorite"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M8 13.5S2.5 10.2 2.5 6.3A2.8 2.8 0 0 1 8 4.9a2.8 2.8 0 0 1 5.5 1.4c0 3.9-5.5 7.2-5.5 7.2Z"/></svg></button>
  <button class="dm-btn dm-btn--sm" type="button">Small</button>
</div>
</body>
</html>
