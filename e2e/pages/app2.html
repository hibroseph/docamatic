<!doctype html><html><head><meta charset="utf-8"><title>Mixed layout</title>
<style>
body{margin:0;font-family:system-ui,sans-serif}
#rail{position:fixed;top:0;left:0;bottom:0;width:300px;background:#eef1f6;display:flex;flex-direction:column}
#rail h2{margin:0;padding:16px}
#chats{flex:1;overflow:auto;padding:0 16px}
.row{padding:14px 0;border-bottom:1px solid #ddd}
#page{margin-left:300px;padding:24px 40px;height:2400px}
#inline{height:300px;overflow:auto;border:1px solid #ccc;margin-top:600px;padding:0 16px}
</style></head><body>
<div id="rail"><h2>Chats</h2><div id="chats"></div></div>
<div id="page"><h1>Long page that scrolls</h1><p>Scroll me.</p><div id="inline"></div></div>
<script>
for(const [id,n] of [["chats",60],["inline",40]]){const el=document.getElementById(id);for(let i=1;i<=n;i++){const d=document.createElement('div');d.className='row';d.textContent=id+' row '+i;el.appendChild(d)}}
</script></body></html>
