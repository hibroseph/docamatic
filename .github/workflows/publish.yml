# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-nodejs-with-github-actions

name: publish extension

on:
  workflow_dispatch:
    inputs:
      build_version:
        required: true
        description: the version the app was built with in github
      chrome_extension_id:
        required: true
        description: the chrome extension id to publish to
      environment:
        required: true
        description: environment to deploy to (ex uat, production)
      run_id:
        required: true
        description: the run of the build of the artifact

jobs:
  publish:
    runs-on: ubuntu-22.04
    environment: ${{ github.event.inputs.environment }}
    permissions:
      contents: write # create the GitHub Release
      actions: read   # download artifacts from the build run
    steps:
    - name: "Checkout"
      uses: actions/checkout@v4
    
    - name: Download Extension Artifact
      id: download-artifact
      uses: dawidd6/action-download-artifact@v12
      with:
        workflow: build-extension.yml
        workflow_conclusion: success
        run_id: ${{ github.event.inputs.run_id }}
        name: extension
        if_no_artifact_found: fail
    
    - name: Download Sentry Artifact
      id: download-sentry-artifact
      uses: dawidd6/action-download-artifact@v12
      with:
        workflow: build-extension.yml
        workflow_conclusion: success
        run_id: ${{ github.event.inputs.run_id }}
        name: sentry
        path: ./sentry
        if_no_artifact_found: fail

    # The bundles were given debug ids at build time (see build.sh), which is
    # how Sentry matches a stack trace to its source map. No url prefix is
    # needed, so this works for every extension id/environment.
    - name: Upload source maps to Sentry
      env:
        SENTRY_ORG: "joe-patrol"
        SENTRY_PROJECT: "docamatic"
        SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        SENTRY_RELEASE: "docamatic@${{ github.event.inputs.build_version }}"
      run: |
        npx --yes @sentry/cli@2 releases new "$SENTRY_RELEASE"
        npx --yes @sentry/cli@2 sourcemaps upload --release "$SENTRY_RELEASE" ./sentry
        # Not finalized: the build still has to go through Chrome Web Store review

    # Keep the exact package users get, attached to a GitHub Release tagged
    # v<version>. The upgrade test downloads the previous release's app.zip
    # from here, so it tests what users really have installed. Created before
    # the Web Store upload because that step may need to be done by hand.
    - name: Create GitHub Release
      if: github.event.inputs.environment == 'production'
      env:
        GH_TOKEN: ${{ github.token }}
        VERSION: ${{ github.event.inputs.build_version }}
        RUN_ID: ${{ github.event.inputs.run_id }}
      run: |
        TAG="v$VERSION"
        if gh release view "$TAG" > /dev/null 2>&1; then
          echo "Release $TAG already exists, leaving it as is"
          exit 0
        fi
        # Tag the commit the package was built from, not the current branch head
        COMMIT=$(gh run view "$RUN_ID" --json headSha --jq .headSha)
        gh release create "$TAG" ./app.zip \
          --target "$COMMIT" \
          --title "Docamatic $VERSION" \
          --notes "Package uploaded to the Chrome Web Store. Built by workflow run $RUN_ID."

    - name: Chrome Webstore Access Token
      run: |
        ACCESS_TOKEN=$(curl --fail-with-body -v "https://accounts.google.com/o/oauth2/token" -d "client_id=${{secrets.CHROME_WEBSTORE_CLIENT_ID}}&client_secret=${{secrets.CHROME_WEBSTORE_CLIENT_SECRET}}&refresh_token=${{secrets.CHROME_WEBSTORE_REFRESH_TOKEN}}&grant_type=refresh_token" | jq -r '.access_token')
        echo "::add-mask::$ACCESS_TOKEN"
        echo "ACCESS_TOKEN=$ACCESS_TOKEN" >> $GITHUB_ENV
        
    - name: Chrome Webstore Publish
      run: |
        curl \
        -H "Authorization: Bearer ${{ env.ACCESS_TOKEN }}"  \
        -H "x-goog-api-version: 2" \
        -X PUT \
        -T ./app.zip \
        -i \
        --fail-with-body \
        https://www.googleapis.com/upload/chromewebstore/v1.1/items/${{ github.event.inputs.chrome_extension_id }}
