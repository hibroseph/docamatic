<!-- @dsCard group="Forms" height=200 subtitle="Field, search, error" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; }
  body { background: var(--paper); color: var(--ink); font-family: var(--font-body); }
  .stage { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-4); padding: var(--space-4); }
  
</style>
</head>
<body class="dm-root">
<div class="stage" style="display:grid; gap: var(--space-4); max-width: 360px;">
  <div class="dm-search"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="7" cy="7" r="4.5"/><path d="m10.5 10.5 3 3"/></svg><input class="dm-input" id="ds-search" type="search" placeholder="Search your notes" aria-label="Search your notes"></div>
  <div class="dm-field">
    <label class="dm-field__label" for="ds-tag">New tag</label>
    <input class="dm-input" id="ds-tag" value="learning">
    <span class="dm-field__help">Press Enter to add it to this note.</span>
  </div>
  <div class="dm-field">
    <label class="dm-field__label" for="ds-file">Backup file</label>
    <input class="dm-input" id="ds-file" value="notes.txt" aria-invalid="true">
    <span class="dm-field__help dm-field__help--error">This file isn't a Docamatic backup. Choose the .json file you downloaded.</span>
  </div>
</div>
</body>
</html>
